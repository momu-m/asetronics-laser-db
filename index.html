<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALPA - Asetronics Laser-Programm-Archiv</title>

    <!-- Inter Schriftart -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login">

    <!-- =================================================================
         LOGIN-SEITE (Split-Screen)
         =================================================================
         Links:  Brand-Panel mit Asetronics-Blau und Logo
         Rechts: Login-Formular
         ================================================================= -->

    <div class="login-page">

        <!-- Linke Haelfte: Brand-Panel -->
        <div class="login-brand">
            <img src="assets/asetronics-logo.png"
                 alt="Asetronics AG"
                 class="login-brand-logo">

            <h1>Laser-Programm-<br>Archiv</h1>
            <p>
                Internes Tool zur Verwaltung und Verteilung
                konvertierter Laser-3-Programme.
                SMT-Produktion, Bern.
            </p>

            <div class="login-brand-meta">
                ALPA v1.0 &middot; Build 2026-08-10
            </div>
        </div>

        <!-- Rechte Haelfte: Login-Formular -->
        <div class="login-form-side">
            <div class="login-form">

                <h2>Anmeldung</h2>
                <p class="login-sub">
                    Bitte mit Firmen-E-Mail anmelden.
                </p>

                <!-- Meldungsbereich -->
                <div id="message" style="display: none;"></div>

                <!-- Login-Formular -->
                <form onsubmit="login(event)">

                    <div class="form-group">
                        <label class="form-label" for="email">E-Mail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-input"
                            placeholder="vorname.nachname@asetronics.ch"
                            required
                            autocomplete="email"
                            autofocus>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Passwort</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-input"
                            placeholder="Passwort"
                            required
                            autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 8px;">
                        Anmelden
                    </button>

                </form>

                <p style="margin-top: 32px; font-size: 12px; color: var(--as-text-muted);">
                    Zugriff nur fuer freigeschaltete Benutzer.
                    Bei Problemen Mohamad Murad kontaktieren.
                </p>

            </div>
        </div>

    </div>

    <!-- =================================================================
         JAVASCRIPT
         =================================================================
         Reihenfolge: Supabase-Bibliothek (CDN), dann config, dann app.js
         ================================================================= -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
